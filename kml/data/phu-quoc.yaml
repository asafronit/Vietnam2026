- name: Hon Thom (Pineapple Island) dive sites
  area: An Thoi archipelago, below the cable car
  what: Two separate sites on the same island. North Pineapple Point reaches about 18 metres
    over a rocky bottom carrying a large colony of whip corals, with cuttlefish and reef
    fish. South Pineapple Point drops to 35 metres and is the deepest dive in Phu Quoc.
