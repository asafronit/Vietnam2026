must_see:
- name: Hon Thom Cable Car
  area: An Thoi, southern Phu Quoc
  what: A three-cable gondola line running almost 8 km from the An Thoi coast
    over open sea to Hon Thom island, in 30-passenger cabins over a 15-minute
    ride, passing above two smaller islands en route.
  why: Guinness World Record holder for the longest three-wire sea-crossing
    cable car, and the way most visitors reach Hon Thom's Sun World park
  confidence: high
  geocode_query: Hon Thom Cable Car, An Thoi, Phu Quoc, Vietnam
  sources:
  - https://blog.premierresidencesphuquoc.com/hon-thom-cable-car/
  - https://www.vietjetair.com/en/news/travel-guides-1665635013747/hon-thom-phu-quoc-cable-car-review-the-worlds-longest-sea-crossing-cable-car-1768878737803
attractions:
- name: Rainbow Divers fun dive, An Thoi archipelago
  area: An Thoi, southern Phu Quoc
  what: A twin-deck dive boat trip from Vietnam's longest-established PADI
    dive centre to reef sites in the An Thoi islands, groups capped at 4
    divers per guide, with a full lunch served on board after the southern
    route.
  why: The certified-diver option for the trip's PADI Open Water diver -
    Vietnam's oldest PADI operation, running since 1996, at $65-85 per dive,
    cheaper than equivalent sites in Thailand or Indonesia
  confidence: high
  geocode_query: Rainbow Divers, Duong Dong, Phu Quoc, Vietnam
  sources:
  - https://www.divevietnam.com/dive-centres/phu-quoc-island/
  - https://www.tripadvisor.com/Attraction_Review-g1184679-d1818391-Reviews-Rainbow_Divers-Duong_Dong_Phu_Quoc_Island_Kien_Giang_Province.html
- name: Discover Scuba Diving for beginners
  area: An Thoi archipelago, southern Phu Quoc
  what: A no-certification-required introduction to scuba, run one-on-one
    with an instructor who controls depth, direction and equipment; divers
    go no deeper than 6 metres across two roughly 20-minute dives after a
    shallow-water briefing and skills practice.
  why: The option for the non-certified traveler to dive alongside the
    certified diver on the same trip, rather than being left snorkeling
  confidence: high
  geocode_query: Discover Scuba Diving, Phu Quoc, Vietnam
  sources:
  - https://divephuquoc.com/discover-scuba-diving
  - https://www.pelago.com/en-US/activity/puc6f7qxy-padi-discover-scuba-diving-for-beginners-phu-quoc/
- name: Vinpearl Safari Phu Quoc
  area: Bai Dai, northwest Phu Quoc
  what: Vietnam's largest wildlife conservation park, home to roughly 4,500
    animals across 200 species including Bengal tigers, African lions,
    giraffes and white rhinos, viewable from a safari-style drive-through
    zone and walking areas.
  why: The largest wildlife park in the country, and a full-day option that
    doesn't require a beach or a boat
  confidence: high
  geocode_query: Vinpearl Safari Phu Quoc, Bai Dai, Vietnam
  sources:
  - https://vinwonders.com/en/wonderpedia/news/review-of-vinpearl-safari-phu-quoc/
  - https://www.tripadvisor.com/Attraction_Review-g469418-d9748314-Reviews-Vinpearl_Safari_Phu_Quoc-Phu_Quoc_Island_Kien_Giang_Province.html
