markets:
- name: Phu Quoc Night Market (Dinh Cau)
  area: Duong Dong, Bach Dang street
  what: A single-street night market where diners pick live fish, crab or
    squid from tanks to be grilled or steamed to order, alongside stalls
    selling herring salad, banh xeo pancakes and grilled scallops.
  why: The island's main after-dark food destination since its 2016 merger
    with the old Dinh Cau market, and the best single stop for trying local
    seafood specialties in one place
  confidence: high
  geocode_query: Phu Quoc Night Market, Duong Dong, Phu Quoc, Vietnam
  sources:
  - https://www.baconismagic.ca/vietnam/phu-quoc-night-market/
  - https://vinwonders.com/en/wonderpedia/news/phu-quoc-night-market/
logistics:
- name: Grab and taxi from Phu Quoc International Airport
  area: Phu Quoc International Airport (PQC), about 10 km south of Duong Dong
  what: Grab and metered taxis both operate from the terminal; a ride to the
    Long Beach hotel strip takes about 10-15 minutes and costs roughly
    100,000-200,000 VND, with Grab typically 10-20% cheaper than the metered
    taxi rate.
  why: The airport sits close enough to the main hotel strip that a transfer
    is short and cheap regardless of which resort is booked
  confidence: high
  geocode_query: Phu Quoc International Airport, Vietnam
  sources:
  - https://www.airporttransferportal.com/airport-guides/pqc/cost-to-city
  - https://www.grab.com/global/airport-rides/phu-quoc-international-airport/
- name: Speedboat from the Mekong Delta (Ha Tien)
  area: Ha Tien to Bai Vong pier, Phu Quoc
  what: Fast boats from Ha Tien on the Mekong Delta coast to Phu Quoc's Bai
    Vong pier run 3-5 times daily between about 6am and 2pm, taking roughly
    1.5 hours; slower car ferries take about 3 hours on the same route.
  why: Connects a Mekong Delta stop directly to Phu Quoc without backtracking
    through Ho Chi Minh City for a flight
  confidence: high
  geocode_query: Bai Vong Ferry Terminal, Phu Quoc, Vietnam
  sources:
  - https://www.vietnamcoracle.com/phu-quoc-island-ferry-times/
