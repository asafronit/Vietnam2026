diving:
- name: An Thoi archipelago - the dive area
  area: Southern Phu Quoc, reached from An Thoi town
  what: Twelve islands off the southern tip with roughly seventeen named dive sites. The
    reef comes in two layers - hard coral in the shallows, soft coral below about 7 metres -
    and the life is small rather than big - reef fish, nudibranchs, cuttlefish, crabs. Average
    depth across the sites is about 8 metres and the deepest reaches 35. Boats usually moor
    in shallow, sheltered water and the crew picks the day's two sites by sea state rather
    than by schedule.
  why: The one place on this itinerary where diving actually works in late November. The
    season runs November to April, visibility reaches 15-20 metres from late November, and
    the northeast monsoon that shuts the north and east of the island leaves the south calm
  confidence: high
  geocode_query: An Thoi Archipelago, Phu Quoc, Vietnam
  sources:
  - https://localvietnam.com/phu-quoc/diving-in-phu-quoc/
  - https://phuquocdivezone.com/dive-sites-phu-quoc/
  name_he: ארכיפלג אן תוי — אזור הצלילה
  area_he: דרום פו קוק, יוצאים מהעיירה אן תוי
  what_he: 'שנים-עשר איים מול הקצה הדרומי, עם כשבעה-עשר אתרי צלילה נקובים בשם. השונית בנויה
    בשתי שכבות — אלמוג קשה במים הרדודים, אלמוג רך מתחת לכשבעה מטרים — והחיים שם קטנים ולא
    גדולים: דגי שונית, נודיברנכים, דיונונים, סרטנים. העומק הממוצע בין האתרים הוא כשמונה
    מטרים והעמוק שבהם מגיע ל-35. הסירות עוגנות בדרך כלל במים רדודים ומוגנים, והצוות בוחר
    את שני אתרי היום לפי מצב הים ולא לפי לוח זמנים.'
  why_he: המקום היחיד במסלול הזה שבו צלילה באמת עובדת בסוף נובמבר. העונה נמשכת מנובמבר עד
    אפריל, הראות מגיעה ל-15 עד 20 מטר מסוף נובמבר, והמונסון הצפון-מזרחי שסוגר את הצפון
    והמזרח של האי משאיר את הדרום רגוע
- name: Rainbow Divers fun dive, An Thoi archipelago
  area: An Thoi, southern Phu Quoc
  what: A twin-deck dive boat trip from Vietnam's longest-established PADI dive centre to
    reef sites in the An Thoi islands, groups capped at 4 divers per guide, with a full lunch
    served on board after the southern route.
  why: The certified-diver option for the trip's PADI Open Water diver - Vietnam's oldest
    PADI operation, running since 1996, at $65-85 per dive, cheaper than equivalent sites
    in Thailand or Indonesia. The timing is right - the An Thoi season runs November to
    April, visibility reaches 15-20 metres from late November, and the southern sites
    average about 8 metres, which sits well inside the 18-metre Open Water limit
  confidence: high
