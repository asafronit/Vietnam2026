    metres to the turquoise Nho Que River below.
  why: One of Vietnam's "Four Great Passes" and the single most photographed stretch of the
    entire Ha Giang loop
  confidence: high
  geocode_query: Ma Pi Leng Pass viewpoint, Meo Vac, Ha Giang, Vietnam
