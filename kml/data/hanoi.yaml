    lng: 105.8359533
  location_precision: approximate
- name: Hoa Lo Prison Museum
  area: Hoan Kiem, Hoa Lo street
  what: A preserved wing of a French colonial-era prison built in 1896, nicknamed
    the "Hanoi Hilton" by American POWs held there in the 1960s-70s. Exhibits include
    a guillotine and the cell blocks used to hold Vietnamese independence activists.
  why: A blunt, unfiltered look at both the colonial and American-war periods of Vietnamese
    history, in the middle of the modern city
  confidence: high
  geocode_query: Hoa Lo Prison Museum, Hanoi, Vietnam
  sources:
