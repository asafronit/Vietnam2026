- name: Hanoi Train Street coffee shops
  area: Old Quarter, Phung Hung / Le Duan
  what: A row of narrow-gauge cafes squeezed along an active railway corridor; twice
    a day a train passes within arm's reach of the tables and everyone pulls their
    chairs back against the walls.
  why: A genuinely strange, camera-ready five minutes, though access has tightened
    to a store-led system after past crowd-safety closures
  confidence: medium
  geocode_query: Hanoi Train Street, Phung Hung, Hanoi, Vietnam
  sources:
