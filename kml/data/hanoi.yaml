- name: Temple of Literature
  area: Dong Da, Van Mieu street
  what: A walled 2.5-hectare Confucian temple complex founded in 1070, with five courtyards,
    stone stelae on turtle bases recording centuries of exam graduates, and a wooden
    hall dedicated to Confucius.
  why: Vietnam's first national university and one of Hanoi's oldest intact historical
    sites
  confidence: high
