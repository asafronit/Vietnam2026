attractions:
- name: Vietnam Museum of Ethnology
  area: Cau Giay, about 8km from the Old Quarter
  what: An open-air and indoor museum on the 54 officially recognised ethnic groups
    of Vietnam, with full-size reconstructed stilt houses and tombs in the garden
    and 15,000+ artifacts inside.
  why: The single best introduction to the hill-tribe cultures the trip later passes
    through in Sapa and Ha Giang
  confidence: high
  geocode_query: Vietnam Museum of Ethnology, Cau Giay, Hanoi, Vietnam
  sources:
  - https://en.wikipedia.org/wiki/Vietnam_Museum_of_Ethnology
