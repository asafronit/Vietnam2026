logistics:
- name: Noi Bai Airport to Old Quarter transfer
  area: Noi Bai International Airport to Hoan Kiem
  what: The airport sits about 27-30km north of the Old Quarter; a metered taxi or
    pre-booked private transfer takes 30-40 minutes off-peak (up to 90 in traffic)
    and costs roughly 300,000-350,000 VND, while a Grab typically comes in cheaper
    at around 240,000-250,000 VND plus tolls.
  why: The first and last transfer of the whole trip, and the one most worth pre-booking
    to skip the arrivals-hall taxi touts
  confidence: high
