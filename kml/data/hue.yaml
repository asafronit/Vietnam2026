logistics:
- name: Phu Bai Airport to Hue city center
  area: Airport transfer
  what: Phu Bai International Airport sits about 15km south of Hue; a taxi or private
    car to the city center takes 20-30 minutes and costs roughly 250,000-300,000 VND
    ($10-12).
  why: Fixes the transfer time for flying in or out of Hue directly, rather than via
    Da Nang
  confidence: high
  geocode_query: Phu Bai International Airport, Hue, Vietnam
  sources:
