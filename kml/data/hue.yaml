- name: Hai Van Pass - Hue to Da Nang / Hoi An
  area: Route south out of Hue
  what: A 21km mountain pass reaching 500m above sea level on the Thua Thien Hue /
    Da Nang provincial border, driven by private car, motorbike or hired 'easy rider';
    the pass itself takes about 45 minutes, with Da Nang city roughly 30 minutes beyond
    it and Hoi An about 90 minutes from the summit.
  why: The scenic overland alternative to flying or the flat coastal train, and how
    the master-spec's cheap Hue day-trip from Hoi An is physically done
  confidence: high
  geocode_query: Hai Van Pass, Thua Thien Hue, Vietnam
  sources:
  - https://vietnamstory.in/hai-van-pass/
  - https://www.uncovervietnam.com/hai-van-pass-route/
