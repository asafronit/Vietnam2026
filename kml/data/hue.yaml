must_see:
- name: Hue Imperial City (The Citadel)
  area: North bank of the Perfume River, city center
  what: The walled seat of the Nguyen Dynasty from 1802 to 1945, entered through the
    Ngo Mon Gate past the Nine Holy Cannons and the Nine Dynastic Urns, with the To
    Mieu royal family temple inside.
  why: The reason Hue is Vietnam's imperial capital rather than just another river
    city, and the largest single historical site in the country
  confidence: high
  geocode_query: Hue Imperial City Citadel, Hue, Vietnam
  sources:
  - https://www.tripadvisor.com/Attraction_Review-g293926-d317599-Reviews-Hue_Imperial_City_The_Citadel-Hue_Thua_Thien_Hue_Province.html
  - https://culturephamtravel.com/hue-entrance-fee/
- name: Khai Dinh Tomb
  area: Chau Chu Village, ~10km from Hue city
  what: The last and most ornate of the Nguyen royal tombs, its concrete exterior
    built in a Gothic-tinged European style but its interior sarcophagus chamber an
    explosion of colorful ceramic-mosaic murals, reached by 127 stone steps.
  why: The most visually striking of the seven royal tombs and unlike any other Nguyen
    monument in Hue
  confidence: high
  geocode_query: Khai Dinh Tomb, Hue, Vietnam
  sources:
  - https://vinwonders.com/en/wonderpedia/news/khai-dinh-tomb-things-to-know-about-the-last-imperial-tomb-built-in-hue/
  - https://www.lonelyplanet.com/vietnam/central-vietnam/hue/attractions/tomb-of-khai-dinh/a/poi-sig/1158037/357875
  coords:
    lat: 16.3989537
    lng: 107.5902801
- name: Thien Mu Pagoda
  area: Ha Khe Hill, north bank of the Perfume River, ~5km from the city
  what: Hue's oldest religious building, founded in 1601, centred on the seven-storey
    octagonal Phuoc Duyen tower that is the unofficial symbol of the city, with a
    2.5-metre bronze bell inside the main sanctuary.
  why: The single most-photographed landmark on the Perfume River, and over four centuries
    old
  confidence: high
  geocode_query: Thien Mu Pagoda, Hue, Vietnam
  sources:
  - https://vinpearl.com/en/thien-mu-pagoda-hue
  - https://vietnamdiscovery.com/hue/attractions/thien-mu-pagoda/
attractions:
- name: Tu Duc Tomb
  area: Thuy Xuan Village, ~7km from Hue city
  what: A landscaped royal retreat built around a lake in a pine-forested valley,
    where Emperor Tu Duc lived, wrote poetry and boated for years before his death,
    dotted with pavilions and temples rather than a single mausoleum building.
  why: The gentlest and most park-like of the tombs - built as a living retreat, not
    just a burial site - and a contrast to Khai Dinh's grandeur
  confidence: high
  geocode_query: Tu Duc Tomb, Hue, Vietnam
  sources:
  - https://centralvietnamguide.com/tu-duc-tomb/
  - https://vinpearl.com/en/tu-duc-tomb-one-of-the-most-appealing-attractions-in-hue-to-visit
  coords:
    lat: 16.433089
    lng: 107.5647017
- name: Perfume River dragon boat cruise
  area: Departs from piers along the Perfume River, city center
  what: An evening cruise on a wooden dragon-prowed boat past Truong Tien and Phu
    Xuan bridges, typically with a live Ca Hue folk-music performance on board and
    the option to release a lotus lantern onto the water.
  why: The classic way to see Hue's bridges and riverbanks lit up at night, and to
    hear Ca Hue court music in something like its original setting
  confidence: medium
  geocode_query: Perfume River dragon boat pier, Hue, Vietnam
  sources:
  - https://www.getyourguide.com/hue-vietnam-l833/sunset-boat-tour-along-perfume-river-t394246/
  - https://culturephamtravel.com/hue-dragon-boat-trip/
