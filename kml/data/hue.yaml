markets:
- name: Dong Ba Market
  area: North bank of the Perfume River, city center
  what: Hue's biggest market, a three-floor bell-shaped building where the ground
    floor sells dried seafood and local sauces, the second floor sells crafts like
    forged knives and ceramics, and the third is devoted to ao dai tailoring.
  why: Central Vietnam's largest and oldest market, and as much a symbol of Hue's
    identity as the Citadel
