from: hanoi
to: sapa
reverse_ok: true
note: About 320 km. Every option reaches Sapa town except the train, which stops at Lao Cai,
  38 km below, and needs a bus or car for the last hour. There is no flight - Sapa has no airport
  (a 2022 groundbreaking, still no investor in 2026).
note_he: כ-320 ק"מ. כל האפשרויות מגיעות עד העיירה סאפה, חוץ מהרכבת, שעוצרת בלאו קאי, 38 ק"מ
  למטה, ומשם צריך עוד שעה באוטובוס או ברכב. אין טיסה - לסאפה אין שדה תעופה (טקס אבן פינה
  ב-2022, ועד 2026 לא נמצא משקיע).
