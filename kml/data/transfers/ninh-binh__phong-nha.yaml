from: ninh-binh
to: phong-nha
reverse_ok: true
note: About 7 hours overnight. Ninh Binh has no airport; the train stops at Dong Hoi, 45 km from Phong
  Nha. Flying means going back to Hanoi for a flight to Dong Hoi.
note_he: כשבע שעות בלילה. בנין בין אין שדה תעופה; הרכבת עוצרת בדונג הוי, 45 ק"מ מפונג נה. טיסה
  פירושה לחזור להאנוי ולטוס משם לדונג הוי.
