markets:
- name: Cho Rong (Rong Market)
  area: 71 Van Giang Street, Thanh Binh Ward
  what: Ninh Binh city's main traditional market, spread across a three-story building
    and open-air stalls, selling household goods, textiles and a fresh-produce section
    with rice, fish, mountain goat meat and Kim Son rice wine.
  why: The everyday market locals actually shop at, as opposed to the tourist-facing
    night market
  confidence: medium
  geocode_query: Cho Rong Market, Ninh Binh, Vietnam
  sources:
  - https://hanoiexploretravel.com/things-to-do-ninh-binh/rong-market
  coords:
    lat: 20.2561711
    lng: 105.9776166
  location_precision: approximate
- name: Ninh Binh Night Market
  area: Around Dinh Tien Hoang Street and Ky Lan Lake, city center
  what: Streets around the city-center lake fill from 6pm to 11pm with food stalls
    and vendors selling embroidered scarves, clothing and souvenirs from nearby craft
    villages like Van Lam.
  why: The evening counterpart to the daytime boat trips, and the easiest place to
    try street food after a day on the water
  confidence: medium
  geocode_query: Ninh Binh Night Market, Ninh Binh, Vietnam
  sources:
  - https://vietnamdiscovery.com/ninh-binh/ninh-binh-night-market/
  - https://sinhcafe.com/ninh-binh-night-market
logistics:
- name: Ninh Binh to Hanoi (train and road)
  area: Regional transfer
  what: Ninh Binh's train station sits centrally in the city; five daily trains run
    to Hanoi's main station on Le Duan Street in about 2 hours, or a private car takes
    roughly the same time by road.
  why: Fixes the practical transfer time between Ninh Binh and the trip's Hanoi anchor
  confidence: high
  geocode_query: Ninh Binh Railway Station, Ninh Binh, Vietnam
  sources:
  - https://oxalisadventure.com/hanoi-to-ninh-binh-best-transport-options/
  - https://a21tours.com/ninh-binh-city-to-hanoi-transfer
  coords:
    lat: 20.2421142
    lng: 105.9746207
- name: Lotus Train - Ninh Binh to Dong Hoi (night train)
  area: Ninh Binh Railway Station, departure point
  what: A privately refurbished overnight sleeper carriage (2-berth or 4-berth cabins,
    Vietnam Railways track) departing Ninh Binh around 22:00 and arriving Dong Hoi
    around 06:00, with onboard wifi, snacks and breakfast.
  why: Turns the long road transfer south toward Phong Nha into a night's sleep instead
    of a lost travel day
  confidence: medium
  geocode_query: Ninh Binh Railway Station, Ninh Binh, Vietnam
  sources:
