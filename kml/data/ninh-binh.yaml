must_see:
- name: Trang An Scenic Landscape Complex
  area: Ninh Hai Commune, Hoa Lu District, ~7km from Ninh Binh city
  what: A UNESCO World Heritage limestone karst landscape toured by rowed sampan along
    a 3-hour river route that threads through nine natural cave tunnels beneath the
    cliffs.
  why: The UNESCO-listed core of the whole 'Ha Long Bay on land' comparison, and the
    reason Ninh Binh is on the itinerary at all
  confidence: high
  geocode_query: Trang An Scenic Landscape Complex, Ninh Binh, Vietnam
  sources:
  - https://wherearethosemorgans.com/trang-an-boat-tour/
  - https://www.getyourguide.com/trang-an-l36900/
  coords:
    lat: 20.2537827
    lng: 105.9005014
- name: Tam Coc boat ride
  area: Van Lam Village, Ninh Hai Commune
  what: A shorter 2-hour sampan ride, often rowed by foot, along the Ngo Dong River
    between rice paddies and through three limestone tunnels (Hang Ca, Hang Hai, Hang
    Ba) that give Tam Coc its name.
  why: The classic, more compact counterpart to Trang An - green rice-paddy scenery
    in the dry season, flooded gold fields at harvest
  confidence: high
  geocode_query: Tam Coc boat pier, Ninh Binh, Vietnam
  sources:
  - https://happytovisit.com/ninh-binh-hoa-lu-mua-cave-and-trang-an-tour-and-boat-ride/
  - https://junglebosstours.com/explorer/tourism-blog/trang-an-boat-tour
  coords:
    lat: 20.2163426
    lng: 105.937457
  location_precision: approximate
- name: Mua Cave viewpoint (Hang Mua)
  area: Khe Ha Village, ~10km from Ninh Binh city
  what: A roughly 500-step stone staircase up Mua Mountain to a dragon statue and
    a 360-degree viewpoint over the Tam Coc rice fields and limestone peaks below;
    the climb itself takes 15-45 minutes.
  why: Ninh Binh's signature adventure/physical challenge and its single best photo
    viewpoint, reached under your own steam rather than by boat
  confidence: high
  geocode_query: Hang Mua Mua Cave viewpoint, Ninh Binh, Vietnam
  sources:
  - https://oxalisadventure.com/mua-cave-ninh-binh/
  - https://junglebosstours.com/explorer/tourism-blog/mua-caves-vietnam-travel-guide
attractions:
- name: Hoa Lu Ancient Capital
  area: Truong Yen Commune, ~10km from Ninh Binh city
  what: The restored temples of Dinh Tien Hoang and Le Dai Hanh, marking the site
    of Vietnam's 10th-century capital, set inside a ring of limestone mountains.
  why: The historical anchor of the region, and usually combined with Trang An or
    Mua Cave into one day's route
  confidence: high
  geocode_query: Hoa Lu Ancient Capital, Ninh Binh, Vietnam
  sources:
  - https://happytovisit.com/ninh-binh-hoa-lu-bai-dinh-trang-an-and-mua-cave-tour/
  coords:
    lat: 20.283483
    lng: 105.8995986
- name: Bai Dinh Pagoda
  area: Gia Sinh Commune, ~15km from Ninh Binh city
  what: The largest Buddhist temple complex in Vietnam, spread across a hillside with
    a giant bronze Buddha, hundreds of Arhat statues along covered corridors, and
    a bell tower housing one of Asia's largest bronze bells.
  why: A different register from the boat-and-karst circuit - scale and religious
    architecture rather than nature
  confidence: high
  geocode_query: Bai Dinh Pagoda, Gia Vien, Ninh Binh, Vietnam
  sources:
  - https://happytovisit.com/ninh-binh-hoa-lu-bai-dinh-trang-an-and-mua-cave-tour/
  coords:
    lat: 20.2752292
    lng: 105.8654697
  location_precision: approximate
food:
- name: Duc De Restaurant
  kind: vietnamese
  signal: traveler_recommended
  area: City center, Ninh Binh
  what: A long-running goat-meat restaurant on a main street in Ninh Binh city, serving
    the mountain goat (de nui) dishes the region is known for - steamed, grilled and
    in hotpot.
  why: Consistently the most-reviewed goat-meat specialist in the city center, with
    a reputation built over years rather than a recent tourist spike
  confidence: medium
