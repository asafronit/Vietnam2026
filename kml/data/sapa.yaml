must_see:
- name: Fansipan cable car and Muong Hoa mountain train
  area: Sun Plaza, Sapa town, to Fansipan summit
  what: A combined mountain train (Sun Plaza to Muong Hoa station) and a 6.3km cable
    car climbing to near the summit of Fansipan, at 3,143m the highest peak in Indochina,
    with a pagoda complex at the top station.
  why: The easiest way to stand on the "Roof of Indochina" without a multi-day trek,
    and the combo ticket includes both legs
  confidence: high
  geocode_query: Fansipan Legend Cable Car station, Sapa, Vietnam
  sources:
  - https://junglebosstours.com/explorer/tourism-blog/fansipan-mountain-sapa
  coords:
    lat: 22.3218699
    lng: 103.7995338
  location_precision: approximate
- name: Cat Cat Village
  area: San Sa Ho commune, about 3km from Sapa town
  what: A Black H'mong village at the entrance to the Muong Hoa Valley, founded in
    the mid-19th century, with three streams meeting at Cat Cat waterfall and two
    chain footbridges crossing it.
  why: The most accessible ethnic-minority village from Sapa town, walkable in an
    afternoon
  confidence: high
  geocode_query: Cat Cat Village, Sapa, Vietnam
  sources:
  - https://vinpearl.com/en/cat-cat-village-sapa
  coords:
    lat: 22.3309642
    lng: 103.8340516
- name: Sapa Stone Church and Sun Plaza
  area: Central Sapa town
  what: A Roman-Gothic stone church built in 1926-1935 at the foot of Ham Rong mountain,
    facing the paved square (Sun Plaza) that functions as the town's social centre
    and the starting point for the mountain train.
  why: The literal centre of Sapa town and the anchor point for the Saturday night
    market
  confidence: high
  geocode_query: Sapa Stone Church, Sapa, Vietnam
  sources:
  - https://en.wikipedia.org/wiki/Sa_Pa
attractions:
- name: Black H'mong village trek, Muong Hoa Valley
  area: Muong Hoa Valley, villages south of Sapa town (Lao Chai, Ta Van)
  what: A half- or full-day guided walk on dirt paths through terraced rice fields
    and H'mong/Dao villages in the valley below Sapa, usually led by a local Hmong
    or Dao woman guide.
  why: The most substantive way to see the terrace landscape and meet local families
    rather than just photograph the valley from a viewpoint
  confidence: high
  geocode_query: Muong Hoa Valley trekking trailhead, Sapa, Vietnam
  sources:
  - https://www.ethosspirit.com/sapa-trekking-ethical-tours
markets:
- name: Sapa Love Market
  area: Central square, in front of Sapa Stone Church
  what: A Saturday-evening gathering in the town square where ethnic-minority performers
    sing and dance; historically a courtship custom where young people from different
    villages met, now largely a staged tourism performance rather than the original
    tradition.
  why: Worth seeing for what it is honestly — a living piece of local culture that
    has been reshaped into a weekly show, not the folk custom the name still advertises
  confidence: medium
  geocode_query: Sapa Stone Church square, Sapa, Vietnam
  sources:
  - https://www.ethosspirit.com/sapa-love-market
logistics:
- name: Hanoi to Sapa transfer options
  area: Hanoi to Sapa town
  what: Two practical ways to cover the roughly 300km/6 hours - an overnight sleeper
    train from Hanoi to Lao Cai followed by a 45-60 minute shuttle up to Sapa, or
    a direct day or overnight limousine van/sleeper bus (5.5-6 hours, roughly 300,000-660,000
    VND depending on seat class).
  why: The overnight train turns a dead travel day into a night's sleep, but only
    the van/bus goes door-to-door into Sapa town itself
  confidence: high
  geocode_query: Sapa bus station, Sapa, Vietnam
  sources:
  - https://a21tours.com/sapa-sleeper-bus-vs-limousine-van
  - https://visit-sapa.com/en/blog/hanoi-sapa-bus-limousine
  coords:
    lat: 22.3399787
    lng: 103.8485698
