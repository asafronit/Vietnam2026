logistics:
- name: Hanoi to Tuan Chau Harbour transfer
  area: Hanoi Old Quarter to Tuan Chau Harbour, Ha Long
  what: The standard route to the cruise departure point is a 2.5-3 hour limousine
    bus or private car, usually picked up from the hotel in the Old Quarter around
    8-9am; the cheaper local/public bus takes 3-4 hours with more stops.
  why: Almost every overnight cruise bundles this transfer into the booking, but it's
    worth confirming the pickup time and point in writing beforehand
  confidence: high
  geocode_query: Tuan Chau Harbour, Ha Long, Vietnam
  sources:
  - https://bhayacruises.com/blog/get-from-hanoi-to-halong-bay/
