must_see:
- name: Ha Long Bay limestone karsts
  area: Ha Long Bay, Quang Ninh province
  what: Roughly 1,600 limestone islands and karst pillars rising from emerald-green
    water, many topped with vegetation and containing caves; a UNESCO World Heritage
    Site since 1994.
  why: The reason this leg of the trip exists — best seen slowly, from the deck of
    an overnight boat
  confidence: high
  geocode_query: Ha Long Bay, Vietnam
  sources:
  - https://whc.unesco.org/en/list/672/
  coords:
    lat: 20.9084384
    lng: 107.0682782
- name: Cat Ba National Park
  area: Central Cat Ba Island
  what: A national park covering most of Cat Ba Island's interior, protecting tropical
    limestone forest, wetlands and mangroves; part of the joint Ha Long Bay-Cat Ba
    Archipelago UNESCO World Heritage Site and a UNESCO Biosphere Reserve since 2004.
  why: The forested, trekkable counterpart to the bay's boat-only islands, and home
    to the critically endangered Cat Ba langur
  confidence: high
  geocode_query: Cat Ba National Park, Cat Ba Island, Vietnam
  sources:
  - https://en.wikipedia.org/wiki/C%C3%A1t_B%C3%A0_National_Park
attractions:
- name: Deep water soloing, Lan Ha Bay
  area: Lan Ha Bay, off Cat Ba Island
  what: Free climbing (no ropes or harness) up short limestone cliff routes directly
    from a boat, falling into the sea when you lose your grip; typically a half-day
    trip combined with kayaking into hidden lagoons.
  why: The single most distinctive adventure activity on this leg of the trip, and
    specific to this limestone coastline
  confidence: high
  geocode_query: Deep water soloing Lan Ha Bay, Cat Ba, Vietnam
  sources:
  - https://catbaclimbing.com/half-day-deep-water-solo
  - https://www.catbaventures.com/cat-ba-tours/a-half-day-deep-water-soloing-in-lan-ha-bay-cat-ba-4-hours.html
- name: Trung Trang Cave
  area: Cat Ba National Park, about 20-30 minutes from the port
  what: A 300-metre natural cave carved through a mountain in the middle of Cat Ba's
    largest valley, with stalactites and stalagmites reachable on a short easy walk.
  why: A quick, low-effort cave stop that fits into a cruise itinerary alongside kayaking,
    without needing a dedicated caving day
  confidence: high
  geocode_query: Trung Trang Cave, Cat Ba Island, Vietnam
  sources:
  - https://www.bestpricetravel.com/travel-guide/trung-trang-cave.html
  - https://www.halongbaycruises.com/travel-guide/explore-cat-ba-island-with-halong-bay-cruises-trung-trang-cave.html
