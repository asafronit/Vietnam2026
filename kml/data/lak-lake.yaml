logistics:
- name: Getting to Lak Tented Camp
  area: Lien Son, on National Highway 27
  what: Lak Lake sits on National Highway 27 about 50km / 1.5 hours south of Buon
    Ma Thuot and roughly 160km / 4 hours north of Da Lat; the tented camp itself is
    reached by a short boat crossing from the village dock, not by driving to the
    door.
  why: 'The one non-obvious detail that shapes the overnight stop: the hotel is boat-access
    only'
  confidence: high
  geocode_query: Lak Lake boat dock, Lien Son, Dak Lak, Vietnam
  sources:
  - https://www.laktentedcamp.com/how-to-travel-to-lak/
  - https://www.aroundtheworld360.com/distance/buon-ma-thuot_vn/lak_vn/
  name_he: איך מגיעים למחנה האוהלים
  area_he: ליין סון, על כביש ארצי 27
  what_he: אגם לאק יושב על כביש ארצי 27, כ-50 קילומטר ושעה וחצי מדרום לבואן מה תואט,
    וכ-160 קילומטר וארבע שעות מצפון לדה לאט. אל מחנה האוהלים עצמו מגיעים בשייט קצר
    ממזח הכפר, ולא בנסיעה עד הדלת.
  why_he: 'הפרט הלא-מובן-מאליו שמעצב את עצירת הלינה: למלון יש גישה בסירה בלבד'
