must_see:
- name: Lak Lake
  area: Lien Son, Lak district
  what: The largest natural freshwater lake in the Central Highlands, ringed by rice
    paddies and forest, crossed by hand-carved dugout canoes rather than motorboats.
  why: The centrepiece of this leg of the route, and the reason the itinerary stops
    here overnight
  confidence: high
  geocode_query: Lak Lake, Dak Lak, Vietnam
  sources:
