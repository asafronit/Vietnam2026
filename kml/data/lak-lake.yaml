attractions:
- name: Lak Lake dugout canoe crossing
  area: Boat launch near Jun village / Lak Tented Camp
  what: A traditional single-log dugout canoe, hand-paddled across Lak Lake at dawn
    or dusk, arranged through Jun village boatmen or through the tented camp.
  why: The way locals actually move across the lake, and a quieter alternative to
    the elephant rides sold nearby in the village
  confidence: medium
  geocode_query: Lak Lake boat launch, Lien Son, Dak Lak, Vietnam
  sources:
  - https://www.laktentedcamp.com/
  - https://www.tripadvisor.com/ShowUserReviews-g3389563-d11875783-r717309876-Lak_Tented_Camp-Lien_Son_Dak_Lak_Province.html
  name_he: חציית האגם בסירה חצובה
  area_he: מעגן ליד הכפר ג'ון ומחנה האוהלים
  what_he: סירה מסורתית חצובה מגזע עץ יחיד, שחותרים בה ידנית על פני אגם לאק עם שחר
