  - https://www.bestpricetravel.com/travel-guide/lak-lake.html
  coords:
    lat: 12.4232112
    lng: 108.1776243
- name: Jun Village (Buon Jun)
  area: South shore of Lak Lake
  what: A M'nong ethnic-minority settlement of wood and rattan stilt houses on the
    lake's south shore, where villagers still weave brocade and fish from dugout canoes.
  why: The most accessible M'nong village on the lake, and the standard stop on the
    easy-rider route through here
  confidence: medium
  geocode_query: Jun Village, Lak Lake, Dak Lak, Vietnam
  sources:
  - https://www.dalattrip.com/fly/jun-village-in-central-highland-of-vietnam/
  - https://authentiktravel.com/lak-lake-a-treasure-of-m-nong-in-dak-lak
attractions:
- name: Lak Lake dugout canoe crossing
  area: Boat launch near Jun village / Lak Tented Camp
  what: A traditional single-log dugout canoe, hand-paddled across Lak Lake at dawn
    or dusk, arranged through Jun village boatmen or through the tented camp.
  why: The way locals actually move across the lake, and a quieter alternative to
    the elephant rides sold nearby in the village
  confidence: medium
  geocode_query: Lak Lake boat launch, Lien Son, Dak Lak, Vietnam
  sources:
