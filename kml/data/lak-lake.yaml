logistics:
- name: Getting to Lak Tented Camp
  area: Lien Son, on National Highway 27
  what: Lak Lake sits on National Highway 27 about 50km / 1.5 hours south of Buon
    Ma Thuot and roughly 160km / 4 hours north of Da Lat; the tented camp itself is
    reached by a short boat crossing from the village dock, not by driving to the
    door.
  why: 'The one non-obvious detail that shapes the overnight stop: the hotel is boat-access
    only'
  confidence: high
  geocode_query: Lak Lake boat dock, Lien Son, Dak Lak, Vietnam
  sources:
