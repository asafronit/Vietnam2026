markets:
- name: Ninh Kieu Night Market
  area: Ninh Kieu, Phan Boi Chau and Phan Chau Trinh streets
  what: A two-street night market a short walk from Ninh Kieu Wharf, split between
    a food court selling grilled skewers, sweet soups and sugarcane juice, and a shopping
    side of cheap clothing and printed T-shirts.
  why: The natural evening follow-on to a riverside stroll, busiest and coolest from
    around 7:30-9:30pm
  confidence: high
  geocode_query: Ninh Kieu Night Market, Can Tho, Vietnam
  sources:
  - https://vinpearl.com/en/can-tho-night-markets
  - https://www.originvietnam.com/destinations/ninh-kieu-night-market/
logistics:
- name: Bus from Ho Chi Minh City to Can Tho
  area: Ho Chi Minh City to Can Tho, roughly 170 km
  what: A sleeper coach (commonly the Futa/Phuong Trang line) covers the route in
    about 3 hours of driving, though the door-to-door trip including rest stops and
    pickup/drop-off typically runs closer to 5 hours; a taxi from the Can Tho bus
    station to Ninh Kieu Wharf adds about 15 minutes.
  why: The standard overland option between the two, and the reason a Mekong stop
    is usually built around an overnight rather than a rushed day trip
  confidence: medium
  geocode_query: Can Tho bus station, Can Tho, Vietnam
  sources:
  - https://vemekong.com/guide-to-can-tho-floating-markets/
  coords:
    lat: 10.0243445
    lng: 105.7615442
- name: Speedboat from the Mekong Delta to Phu Quoc
  area: Ha Tien, Kien Giang province
  what: Fast boats from Ha Tien to Phu Quoc's Bai Vong pier run 3-5 times daily between
    roughly 6am and 2pm, taking about 1.5 hours; car ferries from the same pier take
    about 3 hours and cost slightly less.
  why: Lets a Mekong-to-Phu Quoc leg skip a backtrack to Ho Chi Minh City for a flight
  confidence: high
  geocode_query: Ha Tien ferry terminal, Kien Giang, Vietnam
  sources:
  - https://www.vietnamcoracle.com/phu-quoc-island-ferry-times/
