  name_he: השוק הצף קאי ראנג
  area_he: קאי ראנג, כ-6 קילומטר מדרום-מערב למרכז קאן טו
  what_he: שוק נהר שבו סירות המסחר תולות דוגמה מסחורתן על מוט גבוה כדי שקונים יזהו
    אותן מהמים. הוא מצטמק במהירות — כ-400 סירות בשיא שנות ה-90, כ-200 רשומות היום,
    ודיווחים על 40 בלבד שסוחרות בפועל בבוקר טוב, אחרי שהכבישים החליפו את הנהר. סירות
    התיירים כבר רבות מהסוחרות. פועל מלפני הזריחה, וכשוק סיטונאי נגמר עד אמצע הבוקר.
  why_he: עדיין השוק הצף הגדול ביותר שנותר בדלתה, אבל ללכת אליו לפי מה שהוא היום ולא
    לפי התצלומים — ורק עם שחר. במהלך 2026 דווחו נגישה אגרסיבית והפקעת מחירים. פונג
    דיין, במעלה הזרם, יושב על תעלה צרה מדי לסירות התיירים הגדולות ושומר על מסחר אמיתי
    יותר
  hours: Boats gather from 02:00-03:00 and the market peaks 04:00-06:00; be on the
    water by 05:00
  hours_he: הסירות מתכנסות מ-02:00-03:00 והשוק בשיאו בין 04:00 ל-06:00; כדאי להיות
    על המים עד 05:00
