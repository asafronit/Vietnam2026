must_see:
- name: Cai Rang Floating Market
  area: Cai Rang, about 6 km southwest of central Can Tho
  what: A river market of roughly 200-300 local trading boats and produce barges,
    each hanging a sample of its goods from a tall pole so buyers can spot it from
    the water. It runs from before sunrise and is essentially over as a wholesale
    market by mid-morning.
  why: The largest and most authentic floating market left in the delta, but only
    if timed for its real dawn trading hours, not a mid-morning visit
  confidence: high
  geocode_query: Cai Rang Floating Market, Can Tho, Vietnam
  sources:
  - https://vemekong.com/guide-to-can-tho-floating-markets/
  - https://www.travelfish.org/sight_profile/vietnam/mekong_delta/can_tho/can_tho/2496
  coords:
    lat: 10.0023957
    lng: 105.7443925
attractions:
- name: My Tho and Ben Tre coconut candy village
  area: My Tho and Ben Tre provinces, upper Mekong Delta
  what: A river-island circuit reached by motorboat and narrow-canal sampan (a small
    wooden boat rowed by a boatman in a conical hat), stopping at a small workshop
    where coconut milk is hand-cooked and cut into candy while still warm.
  why: The classic, gentler alternative to Can Tho for a single-day Mekong visit,
    and the standard way to see hand-made coconut candy production
  confidence: high
  geocode_query: Ben Tre coconut candy village, Ben Tre, Vietnam
  sources:
  - https://viet-go.com/en/attractions/my-tho-ben-tre-mekong-delta-guide
  coords:
    lat: 10.0163692
    lng: 105.7379094
  location_precision: approximate
- name: Vinh Trang Pagoda
  area: My Tho
  what: A 19th-century Buddhist pagoda recognised as a national historical relic,
    blending Vietnamese, Khmer and French architectural styles with a large reclining
    Buddha statue in its grounds.
  why: The most architecturally distinct temple in the delta, mixing three building
    traditions in one compound
  confidence: high
  geocode_query: Vinh Trang Pagoda, My Tho, Vietnam
  sources:
  - https://www.viator.com/Mekong-Delta-attractions/Vinh-Trang-Pagoda/d23962-a19069
  coords:
    lat: 10.3628375
    lng: 106.3735689
