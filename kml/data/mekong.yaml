must_see:
- name: Cai Rang Floating Market
  area: Cai Rang, about 6 km southwest of central Can Tho
  what: A river market where trading boats hang a sample of their goods from a tall
    pole so buyers spot it from the water. It is shrinking fast - around 400 boats
    at its 1990s peak, roughly 200 registered today, and reports of as few as 40 actually
    trading on a good morning as roads replaced the river. Tour boats now outnumber
    traders. It runs from before sunrise and is over as a wholesale market by mid-morning.
  why: Still the largest floating market left in the delta, but go for what it is
    now rather than the photographs - and only at dawn. Touts and price gouging were
    reported through 2026. Phong Dien, upstream, sits on a channel too narrow for
    the big tour boats and keeps more real trading
  confidence: high
  geocode_query: Cai Rang Floating Market, Can Tho, Vietnam
  sources:
  - https://vemekong.com/guide-to-can-tho-floating-markets/
  - https://www.aljazeera.com/features/2025/2/28/vietnams-floating-markets-face-uncertain-future-as-life-moves-onshore
  - https://news.tuoitre.vn/are-business-and-management-practices-sinking-cai-rang-floating-market-in-vietnam-103260224205542246.htm
  coords:
    lat: 10.0023957
