attractions:
- name: Marble Mountains (Ngu Hanh Son)
  area: Between Da Nang and Hoi An, on the coast road
  what: Five limestone-and-marble hills, each named for one of the five elements,
    honeycombed with caves and grottoes containing Buddhist shrines; an elevator and
    stairs lead up to viewpoints and the Huyen Khong cave, once used as a wartime
    field hospital.
  why: A genuinely different landscape from Hoi An's flat riverside town, and an easy
    stop on the way to or from Da Nang
  confidence: high
  geocode_query: Marble Mountains Ngu Hanh Son, Da Nang, Vietnam
  sources:
  - https://happytovisit.com/golden-bridge-ba-na-hills-marble-mountain-monkey-mountain/
  coords:
    lat: 16.00402
    lng: 108.2627745
- name: An Bang Beach surf lesson
  area: An Bang Beach, ~3km east of Old Town
  what: A stretch of sandy beach with gentle, beginner-friendly waves, where expat-run
    surf schools rent boards and run lessons; the surf season runs roughly September
    to March.
  why: Hoi An's real board-sport option, and a 20-minute bike ride from the Old Town
    through rice paddies
  confidence: medium
