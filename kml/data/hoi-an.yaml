- name: Hoi An Ancient Town and Japanese Covered Bridge
  area: Old Town, along the Thu Bon River
  what: A UNESCO-listed trading-port town of yellow-walled shophouses, Chinese assembly
    halls and merchant homes dating to the 16th-18th centuries, centred on the 18-metre
    wooden Japanese Covered Bridge that doubles as a small temple.
  why: The reason Hoi An exists on any itinerary - one of Southeast Asia's best-preserved
    trading ports, UNESCO-listed since 1999. Riverside streets flood repeatedly in
    November - up to 2 m in 2025; check the day's water level
  confidence: high
