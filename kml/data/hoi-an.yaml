markets:
- name: Hoi An Central Market
  area: Tran Phu Street, along the Thu Bon riverbank
  what: The daytime market where locals actually shop, selling fresh produce, herbs,
    meat, fish, fabric and household goods across covered stalls a block from the
    river.
  why: The working counterpart to the tourist-facing lantern streets, and a good source
    of cheap street food for lunch
  confidence: medium
  geocode_query: Hoi An Central Market, Hoi An, Vietnam
  sources:
  - https://www.klook.com/blog/hoi-an-markets-guide/
- name: Hoi An Night Market (Nguyen Hoang)
  area: Nguyen Hoang Street, opposite the Japanese Covered Bridge
  what: A roughly 300-metre stretch of Nguyen Hoang Street that fills after dark with
    silk-and-bamboo lantern stalls, street food carts and souvenir vendors on both
    sides of the road.
  why: The largest and most popular night market in Hoi An, and the source of the
    lantern glow the town is known for after sunset
  confidence: high
  geocode_query: Hoi An Night Market Nguyen Hoang Street, Hoi An, Vietnam
  sources:
  - https://vinpearl.com/en/hoi-an-night-market-explore-vibrant-nightlife-inside-an-ancient-town
  - https://culturephamtravel.com/hoi-an-lantern-market/
