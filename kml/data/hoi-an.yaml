  - https://divehoian.com/hoi-an-diving-and-snorkelling-trips/
- name: Cam Thanh coconut forest basket boat ride
  area: Bay Mau coconut forest, Cam Thanh village, ~5km from Old Town
  what: A round bamboo 'basket boat' (thung chai) paddled through the water canals
    of a palm forest that locals call Hoi An's green lung, usually including a spinning-boat
    performance and a net-fishing demonstration.
  why: A lighter, closer-to-town alternative to the Mekong Delta basket-boat experience,
    and popular with families
  confidence: medium
