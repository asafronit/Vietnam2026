diving:
- name: Cham Island snorkeling / diving day trip
  area: Cu Lao Cham, ~15-20 minutes by speedboat from Cua Dai
  what: A cluster of eight granite islands and a UNESCO Biosphere Reserve offshore
    from Hoi An, with coral reefs reachable by snorkeling from the surface or diving
    to around 6 metres or more. The diving season runs March to September. From about
    October the northeast monsoon makes the crossing unreliable, the Hoi An dive centres
    close, and boat services are suspended for days at a time.
  why: Out of season for this trip. The dates fall squarely inside the monsoon shutdown,
    so treat any operator still selling it for late October or November as selling
    weather they cannot deliver. The reef diving for these dates is An Thoi in the
    south of Phu Quoc, where November is the start of the best window
  confidence: high
  avoid: true
  geocode_query: Cu Lao Cham Cham Island, Hoi An, Vietnam
  sources:
