must_see:
- name: Hoi An Ancient Town and Japanese Covered Bridge
  area: Old Town, along the Thu Bon River
  what: A UNESCO-listed trading-port town of yellow-walled shophouses, Chinese assembly
    halls and merchant homes dating to the 16th-18th centuries, centred on the 18-metre
    wooden Japanese Covered Bridge that doubles as a small temple.
  why: The reason Hoi An exists on any itinerary - one of Southeast Asia's best-preserved
    trading ports, UNESCO-listed since 1999
  confidence: high
  geocode_query: Hoi An Ancient Town, Hoi An, Vietnam
  sources:
  - https://vinpearl.com/en/japanese-bridge-hoi-an-a-cultural-symbol-of-the-ancient-town
  - https://grooviet.com/destination/japanese-covered-bridge/
  coords:
    lat: 15.8779509
    lng: 108.3239898
- name: Ba Na Hills and Golden Bridge
  area: Ba Na Mountain, ~45 minutes west of Da Nang
  what: A hilltop resort reached by a record-length cable car, built around a recreated
    French hill-station village and the Golden Bridge - a walkway held up by two giant
    stone hands emerging from the hillside.
  why: The consensus pick over My Son among the trip's competing proposals (route
    decision R6), and Central Vietnam's most photographed modern landmark
  confidence: high
  geocode_query: Ba Na Hills Golden Bridge, Da Nang, Vietnam
  sources:
