must_see:
- name: Phong Nha Cave boat trip
  area: Phong Nha tourism centre, Son River
  what: A 30-minute wooden boat ride up the Son River into a lit, 1.5km-long
    show cave with an underground river running through it — the cave the
    whole town is named for.
  why: The single most accessible cave experience in the park, and the
    reason Phong Nha exists as a destination at all
  confidence: high
  geocode_query: Phong Nha Cave boat station, Son Trach, Quang Binh, Vietnam
  sources:
  - https://junglebosstours.com/explorer/tourism-blog/phong-nha-cave-vietnam-tour-guide
  - https://www.lonelyplanet.com/vietnam/north-central-vietnam/phong-nha-cave/attractions/phong-nha-cave-boat-trip/a/poi-sig/1390925/357910
- name: Paradise Cave
  area: Phong Nha-Ke Bang National Park
  what: A dry cave reached by a steep staircase and jungle path, then a
    kilometre of wooden walkway through a cavern hung with stalactites lit
    to look like an underground cathedral.
  why: Regularly named one of the most beautiful caves in Vietnam, and
    doable without a guide or booking ahead
  confidence: high
  geocode_query: Paradise Cave, Phong Nha-Ke Bang National Park, Quang Binh, Vietnam
  sources:
  - https://www.vietnamtourism.com/en/phong-nha-ke-bang-national-park-tickets-complete-2026-price-guide-and-cave-selection-2
  - https://oxalisadventure.com/paradise-cave-in-phong-nha/
attractions:
- name: Son Doong Cave Expedition
  area: Deep in Phong Nha-Ke Bang National Park, multi-day trek from Km37
  what: A 4-day, 3-night expedition into the world's largest cave passage —
    big enough to hold a Manhattan block, with its own jungle and weather
    inside two collapsed dolines. Porters carry gear; nights are spent
    camping on the cave floor.
  why: The reason Phong Nha is on the caving world's map at all; the single
    hardest and most expensive booking in the area, so it needs to be
    flagged early if it's wanted
  confidence: high
  geocode_query: Son Doong Cave, Phong Nha-Ke Bang National Park, Quang Binh, Vietnam
  sources:
  - https://oxalisadventure.com/tour/son-doong-cave-expedition-4d3n/
  - https://sondoongcave.info/exploration/how-to-get-to-son-doong-cave/
- name: Hang En Cave trek
  area: Phong Nha-Ke Bang National Park, Tu Lan area
  what: A 2-day, 1-night trek to the world's third-largest cave, camping on
    a sand bank inside the cave beside an underground river, with one of
    three giant skylights overhead.
  why: The serious-caving option that doesn't require Son Doong's budget or
    year-ahead booking; a genuine wilderness camp inside a cave
  confidence: high
  geocode_query: Hang En Cave, Phong Nha-Ke Bang National Park, Quang Binh, Vietnam
  sources:
  - https://oxalisadventure.com/tour/hang-en-adventure-cave-camp/
- name: Tu Lan cave system
  area: Tan Hoa commune, ~65km from Phong Nha town
  what: A network of wet caves and jungle valleys explored by wading and
    swimming through cave lakes between limestone chambers, run as tours
    from one day up to a 4-5 day expedition.
  why: The widest range of difficulty of any Phong Nha cave product — a
    single day of swimming through caves, or several days of genuine jungle
    expedition, from the same operator
  confidence: high
  geocode_query: Tu Lan cave system, Tan Hoa, Minh Hoa, Quang Binh, Vietnam
  sources:
  - https://oxalisadventure.com/tour/tu-lan-expedition/
  - https://oxalisadventure.com/tour/tu-lan-1-day-experience/
- name: Hang Tien cave day trek
  area: Phong Nha-Ke Bang National Park, Tu Lan area
  what: A one-day trek through jungle and a river-cut cave system, wading
    and swimming sections included, without the multi-day commitment of
    Tu Lan or Hang En.
  why: The middle option between a boardwalk cave and a multi-day
    expedition; flagged in the project's own vetted research for anyone who
    wants a proper trek without the extra nights
  confidence: high
  geocode_query: Hang Tien Cave, Tan Hoa, Minh Hoa, Quang Binh, Vietnam
  sources:
  - https://oxalisadventure.com/tour/hang-tien-1-day-discovery/
- name: Dark Cave zipline and mud bath
  area: Chay River, Phong Nha-Ke Bang National Park
  what: A short zipline across the Chay River into a pitch-black cave,
    followed by a swim to a natural mud pool deep inside, then kayaking
    back down the river.
  why: The easiest adrenaline activity in Phong Nha — half a day, no
    fitness test, and the one every family and backpacker group does
  confidence: high
  geocode_query: Dark Cave Chay River, Phong Nha-Ke Bang National Park, Quang Binh, Vietnam
  sources:
  - https://www.getyourguide.com/phong-nha-l176859/phong-nha-cave-exploration-and-zipline-dark-cave-tour-t511831/
  - https://junglebosstours.com/explorer/tourism-blog/dark-cave-phong-nha
- name: The Duck Stop
  area: Bong Lai Valley, ~10km from Phong Nha town
  what: A small working duck farm where visitors feed and walk a flock of
    ducks along the paddy dikes, with a buffalo ride and a drink included.
  why: TripAdvisor's #1-ranked Phong Nha attraction and the easiest,
    lightest thing to do on a rest day between caves
  confidence: medium
  geocode_query: The Duck Stop, Bong Lai Valley, Phong Nha, Quang Binh, Vietnam
  sources:
  - https://theduckstop.vn/
  - https://culturephamtravel.com/the-duck-stop/
- name: Pub with Cold Beer
  area: Bong Lai Valley, near the Rao Con River
  what: A rustic family farm-bar down a country lane where you pick a live
    chicken from the garden and it's grilled to order, eaten in hammocks by
    the river.
  why: The best-known stop on the Bong Lai Valley motorbike loop and a
    genuinely local, unstaged meal
  confidence: medium
  geocode_query: Pub with Cold Beer, Bong Lai Valley, Phong Nha, Quang Binh, Vietnam
  sources:
  - https://culturephamtravel.com/the-duck-stop/
food:
- name: The Rice House Phong Nha
  kind: vietnamese
  signal: traveler_recommended
  area: Phong Nha town centre
  what: A bamboo-built restaurant with low lighting serving refined regional
    dishes such as bo la lot (beef wrapped in betel leaf) and braised
    eggplant.
  why: The strongest reviewed sit-down Vietnamese dinner in town (Google
    4.9/1,358, TripAdvisor 5.0/91) and a step up from the backpacker-strip
    kitchens
  confidence: high
  geocode_query: The Rice House Phong Nha, Son Trach, Quang Binh, Vietnam
  sources:
  - https://www.tripadvisor.com/Restaurant_Review-g13163545-d27122855-Reviews-The_Rice_House-Phong_Nha_Quang_Binh_Province.html
  - https://junglebosstours.com/explorer/tourism-blog/phong-nha-restaurants
- name: Ha Chinh Grilled Chicken
  kind: vietnamese
  signal: traveler_recommended
  area: Rice paddies outside Phong Nha town
  what: An unmarked rice-paddy grilled-chicken stall — crispy-skinned chicken
    grilled whole, served with a chilli-and-"cheo" salt dip, stir-fried
    vermicelli and sticky rice.
  why: A rustic, locals-only alternative to the tourist-strip restaurants,
    with a perfect Google rating from over a hundred reviews
  confidence: medium
  geocode_query: Quan Ga Nuong Chinh Ha, Phong Nha, Bo Trach, Quang Binh, Vietnam
  sources:
  - https://junglebosstours.com/explorer/tourism-blog/phong-nha-restaurants
- name: Ganesh Indian Restaurant
  kind: international
  signal: traveler_recommended
  area: Phong Nha town centre
  what: A small Indian restaurant with tandoori and curry dishes cooked to
    order, set inside a dining room decorated in Indian style.
  why: Properly spiced Indian food in a rural Vietnamese caving town is
    genuinely unusual, and it is consistently the top-rated non-Vietnamese
    kitchen in town
  confidence: medium
  geocode_query: Ganesh Indian Restaurant, Son Trach, Phong Nha, Quang Binh, Vietnam
  sources:
  - https://junglebosstours.com/explorer/tourism-blog/phong-nha-restaurants
- name: The Villas Restaurant
  kind: international
  signal: traveler_recommended
  area: Phong Nha riverside, attached to Victory Road Villas
  what: An open-sided riverside restaurant with karst-mountain views serving
    imported steaks and pasta on a full Western menu.
  why: The closest thing Phong Nha has to a proper fine-dining Western
    dinner, for the night you don't want another bowl of pho
  confidence: medium
  geocode_query: The Villas Restaurant, Phong Nha, Bo Trach, Quang Binh, Vietnam
  sources:
  - https://junglebosstours.com/explorer/tourism-blog/phong-nha-restaurants
markets:
- name: Son Trach Market
  area: Son Trach (Phong Nha town centre), by the Phong Nha-Ke Bang tourist centre
  what: A small daily produce market where farmers and traders sell fresh
    vegetables, fruit and river fish from the surrounding villages, busiest
    in the very early morning.
  why: The only real local market in a town otherwise built for tourism, and
    the clearest window into everyday Phong Nha life
  confidence: medium
  geocode_query: Cho Son Trach, Phong Nha, Bo Trach, Quang Binh, Vietnam
  sources:
  - https://pickbestplaces.com/vietnam/phong-nha/local-markets
logistics:
- name: Dong Hoi Airport transfer
  area: Dong Hoi, ~45km / ~1 hour from Phong Nha
  what: Phong Nha's nearest airport, served by domestic flights to Hanoi and
    Ho Chi Minh City; there is no airport bus, only pre-booked private
    transfer or metered taxi for the hour-long drive into Phong Nha.
  why: The fastest way in or out of Phong Nha, and the one where arriving
    without a pre-booked transfer means an expensive on-the-spot taxi
  confidence: high
  geocode_query: Dong Hoi Airport, Dong Hoi, Quang Binh, Vietnam
  sources:
  - https://www.pelago.com/en/activity/pbxax24sn-dong-hoi-airport-to-phong-nha-or-versa-way-dong-hoi/
  - https://www.vietnamtourism.com/en/dong-hoi-to-phong-nha-the-complete-transport-guide-for-2026-2
- name: Dong Hoi railway station
  area: Dong Hoi, ~44km from Phong Nha
  what: The nearest train station to Phong Nha on the North-South line,
    connected onward to Phong Nha by local bus (B4, ~90 minutes), taxi or
    private car.
  why: How the overnight "Lotus" sleeper train from Ninh Binh actually
    arrives at Phong Nha — there is no station in Phong Nha town itself
  confidence: high
  geocode_query: Dong Hoi Railway Station, Dong Hoi, Quang Binh, Vietnam
  sources:
  - https://junglebosstours.com/explorer/tourism-blog/phong-nha-train-station-guide
- name: Private car to Hoi An via Vinh Moc Tunnels and Hai Van Pass
  area: Route south from Phong Nha to Hoi An/Da Nang
  what: A full-day private car transfer south that stops at the Vinh Moc
    tunnels (a real wartime underground village) and crosses the Hai Van
    Pass, arriving in Hoi An by evening.
  why: Turns an otherwise dead transfer day into two more stops, and is the
    route the project's own vetted research settled on over the train
  confidence: high
  geocode_query: Vinh Moc Tunnels, Vinh Linh, Quang Tri, Vietnam
  sources:
  - https://www.getyourguide.com/en-gb/da-nang-l939/hoi-an-private-car-to-phong-nha-with-sightseeing-stops-t892548/
  - https://www.tripadvisor.com/AttractionProductReview-g298082-d20307049-Hoi_An_to_Phong_Nha_by_Private_Car_via_Vinh_Moc_Tunnels-Hoi_An_Quang_Nam_Province.html
