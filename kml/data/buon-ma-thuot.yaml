must_see:
- name: The World Coffee Museum
  area: Tan Loi Ward, inside Trung Nguyen Coffee Village, ~4km from center
  what: A museum built in the style of Central Highlands longhouses, holding over
    10,000 coffee-related artefacts from around the world, with hands-on tasting rooms
    rather than glass display cases.
  why: The signature sight of Vietnam's coffee capital, and the reason most visitors
    come to Buon Ma Thuot at all
  confidence: high
  geocode_query: The World Coffee Museum, Buon Ma Thuot, Vietnam
  sources:
