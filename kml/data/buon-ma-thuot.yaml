- name: Ako Dhong Village
  area: Tan Loi Ward, inside the city
  what: A working Ede ethnic-minority neighbourhood inside the city itself, with more
    than 30 traditional wooden longhouses built on stilts in the shape of boats.
  why: The only place to see genuine Ede stilt-house architecture without leaving
    town
  confidence: high
