- name: Yok Don National Park
  area: Buon Don district, ~40km from center
  what: Vietnam's second-largest national park, a stretch of dry dipterocarp forest
    along the Serepok River where former riding elephants now forage freely under
    the watch of their own mahouts.
  why: Vietnam's first ethical elephant-tourism site, which ended elephant riding
    here in 2018 in favour of observation
  confidence: high
  geocode_query: Yok Don National Park, Dak Lak, Vietnam
  sources:
  - https://vietnam.travel/things-to-do/vietnams-first-ethical-elephant-experience
  - https://www.legendtravelgroup.com/a/ethical-elephant-tour-guide-yok-don-national-park-buon-ma-thuot-dak-lak-eco-tours
attractions:
- name: Trung Nguyen Coffee Village
  area: Ly Thai To Street, Tan An Ward, ~3km from center
  what: A 20,000 sqm compound of replica traditional houses, coffee-roasting displays
    and cafes built by Vietnam's best-known coffee brand, with the World Coffee Museum
    inside its grounds.
  why: A full afternoon of coffee culture in one walkable site, from growing to roasting
    to cup
  confidence: high
  geocode_query: Trung Nguyen Coffee Village, Buon Ma Thuot, Vietnam
  sources:
