- name: No airport metro link yet
  area: Tan Son Nhat International Airport (SGN)
  what: Saigon's first metro line (Line 1, Ben Thanh-Suoi Tien) opened in December
    2024, but no metro or rail line reaches the airport; a dedicated airport link
    is not expected until around 2030.
  why: Rules out the metro as an airport option, which travelers researching the new
    2024 line sometimes assume is already connected
  confidence: medium
  geocode_query: Tan Son Nhat International Airport, Ho Chi Minh City, Vietnam
