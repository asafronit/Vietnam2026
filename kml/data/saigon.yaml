must_see:
- name: Reunification Palace
  area: District 1
  what: A 1960s modernist government building where a North Vietnamese tank crashed
    through the gates on 30 April 1975. The war rooms, radio room and presidential
    quarters are preserved as they were that day.
  why: The single physical location where the Vietnam War's ending is preserved in
    place, not just described
  confidence: high
  geocode_query: Reunification Palace, Ho Chi Minh City, Vietnam
  sources:
  - https://www.getyourguide.com/explorer/ho-chi-minh-ttd272/landmarks-in-ho-chi-minh-city/
  coords:
    lat: 10.7770348
    lng: 106.695488
- name: Notre-Dame Cathedral Basilica of Saigon
  area: District 1
  what: A twin-towered red-brick cathedral built by French colonists in the 1880s
    from bricks imported from Marseille. It has been under scaffolded restoration
    since the late 2010s, with completion pushed to 2027, but the front square remains
    open and Mass is still held.
  why: The city's best-known colonial landmark, worth seeing even mid-restoration
    for the square and the surrounding post office
  confidence: high
  geocode_query: Notre-Dame Cathedral Basilica of Saigon, Ho Chi Minh City, Vietnam
  sources:
  - https://saigoneer.com/saigon-news/25698-saigon-extends-notre-dame-cathedral-renovation-by-4-years-to-2027
attractions:
- name: Cu Chi Tunnels
  area: Cu Chi District, about 1.5 hours from central Saigon
  what: A preserved section of the more than 120 km of hand-dug underground tunnel
    network used by Viet Cong fighters, with widened crawl-through sections, hidden
    trapdoor entrances and reconstructed underground rooms.
  why: The signature half-day trip from Saigon, and one of the few places in Vietnam
    you physically enter the war rather than just read about it
  confidence: high
  geocode_query: Cu Chi Tunnels, Ho Chi Minh City, Vietnam
  sources:
  - https://www.holidify.com/places/ho-chi-minh-city/sightseeing-and-things-to-do.html
  coords:
    lat: 11.0630436
    lng: 106.5291244
- name: War Remnants Museum
  area: District 3
  what: A three-storey museum housing over 20,000 artifacts, photographs and military
    hardware across nine permanent exhibitions on the Vietnam War and its aftermath,
    including an outdoor yard of captured US tanks and aircraft.
  why: The most direct, unfiltered account of the war from the Vietnamese side, consistently
    rated the city's top museum
  confidence: high
  geocode_query: War Remnants Museum, Ho Chi Minh City, Vietnam
  sources:
  - https://ahoyvietnam.com/war-remnants-museum/
  coords:
    lat: 10.7793647
    lng: 106.6922806
