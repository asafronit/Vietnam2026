logistics:
- name: Grab from Tan Son Nhat Airport
  area: Tan Son Nhat International Airport (SGN)
  what: Ride-hailing pickup for Grab cars is outside the arrivals hall, past the metered-taxi
    rank; a ride to District 1 takes 25-50 minutes depending on traffic and costs
    roughly 110,000-250,000 VND.
  why: Cheaper and more predictable than the taxi rank, with a fixed upfront fare
    shown before booking
  confidence: high
  geocode_query: Tan Son Nhat International Airport, Ho Chi Minh City, Vietnam
