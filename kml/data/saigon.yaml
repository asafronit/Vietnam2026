markets:
- name: Ben Thanh Market
  area: District 1
  what: A covered market of nearly 1,450 stalls under a French-built 1914 clock-tower
    facade, selling everything from produce and dried goods to clothing, souvenirs
    and a food court, spilling into a street-food night market outside after dark.
  why: The city's oldest and largest market, and the default orientation point for
    District 1
  confidence: high
