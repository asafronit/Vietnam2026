- name: Notre-Dame Cathedral Basilica of Saigon
  area: District 1
  what: A twin-towered red-brick cathedral built by French colonists in the 1880s
    from bricks imported from Marseille. It has been under scaffolded restoration
    since July 2017; the 2027 target has since slipped further, and scaffolding and
    hoardings still limit access. The front square remains open and Mass is still
    held. Two gold-plated crosses went back on the towers in March 2026.
  why: The city's best-known colonial landmark - but expect a building wrapped in
    scaffolding, not the postcard. The square and the Central Post Office beside it
    are the reason to stand there
  confidence: high
  geocode_query: Notre-Dame Cathedral Basilica of Saigon, Ho Chi Minh City, Vietnam
  sources:
  - https://saigoneer.com/saigon-news/25698-saigon-extends-notre-dame-cathedral-renovation-by-4-years-to-2027
